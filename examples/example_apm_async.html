<html>

<head>
	<!-- Page styling here -->
	<link rel='stylesheet' type='text/css' href='./style/style.css'>

	<!--Countbase script-->
	<script type='text/javascript'>
		//some default pre init
		var Countbase = Countbase || {};
		Countbase.q = Countbase.q || [];

		//provide countbase initialization parameters
		Countbase.app_key = "YOUR_APP_KEY";
		Countbase.url = "https://your.server.ly"; //your server goes here

		if (Countbase.app_key === "YOUR_APP_KEY" || Countbase.url === "https://your.server.ly") {
			console.warn("Please do not use default set of app key and server url")
		}

		Countbase.debug = true;
		Countbase.loadAPMScriptsAsync = true;
		// Countbase.customSourceBoomerang = "../somewhere/boomerang.min.js";
		// Countbase.customSourceCountbaseBoomerang = "../somewhere/countbase_boomerang.js";

		//start pushing function calls to queue:

		// track sessions automatically
		Countbase.q.push(['track_sessions']);

		// track sessions automatically
		Countbase.q.push(['track_pageview']);

		// enable APM
		Countbase.q.push(['track_performance']);

		//load countbase script asynchronously
		(function () {
			var cly = document.createElement('script'); cly.type = 'text/javascript';
			cly.async = true;
			//enter url of script here
			cly.src = '../lib/countbase.js';
			cly.onload = function () { Countbase.init() };
			var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(cly, s);
		})();
		//send event on button click
		function clickEvent() {
			Countbase.q.push(['add_event', {
				key: "buttonClick",
				"segmentation": {
					"id": "id"
				}
			}]);
		}
	</script>
</head>

<body>
	<!-- Header, banner etc. Top part of your site  -->
	<div id="header">
		<h1>Async Countbase Implementation</h1>
		<img id="logo" src="./images/logo.png">
	</div>

	<center>
		<img src="./images/team_countbase.jpg" id="wallpaper" />
		<br />
		<input type="button" id="testButton" onclick="clickEvent()" value="Test Button">
		<p><a href='https://countly.com/'>Countbase</a></p>
	</center>
</body>

</html>
