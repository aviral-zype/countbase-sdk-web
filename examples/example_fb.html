<!--
Example on collecting user information from FaceBook
-->
<html>

<head>
    <!-- Page styling here -->
    <link rel='stylesheet' type='text/css' href='./style/style.css'>

    <!--Countbase script-->
    <script type='text/javascript' src='../lib/countbase.js'></script>
    <script type='text/javascript'>

        const COUNTBASE_SERVER_KEY = "https://your.server.ly";
        const COUNTBASE_APP_KEY = "YOUR_APP_KEY";

        if (COUNTBASE_APP_KEY === "YOUR_APP_KEY" || COUNTBASE_SERVER_KEY === "https://your.server.ly") {
            console.warn("Please do not use default set of app key and server url")
        }
        // initializing countbase with params
        Countbase.init({
            app_key: COUNTBASE_APP_KEY,
            url: COUNTBASE_SERVER_KEY, //your server goes here
            debug: true
        });
        Countbase.begin_session();
    </script>
</head>

<body>
    <!-- Header, banner etc. Top part of your site  -->
    <div id="header">
        <h1>Collecting Facebook Info</h1>
        <img id="logo" src="./images/logo.png">
    </div>

    <center>
        <img src="./images/team_countbase.jpg" id="wallpaper" />
    </center>
    <script src="https://connect.facebook.net/en_US/all.js"></script>
    <script type="text/javascript">
        FB.init({
            appId: '251676171676751',
            status: true,
            cookie: true,
            oauth: true
        });

        function CountbaseGatherFBData() {
            Countbase.collect_from_facebook({ "location": "location.name", "tz": "timezone", "somekey": "none.existing.key" });
        };

        FB.getLoginStatus(function (stsResp) {
            if (stsResp.authResponse) {
                //alert("is logged in");
                CountbaseGatherFBData();
            } else {
                FB.login(function (loginResp) {
                    if (loginResp.authResponse) {
                        //alert("authenticated");
                        CountbaseGatherFBData();
                    } else {
                        alert('Please authorize this application to use it!');
                    }
                });
            }
        });
    </script>
</body>

</html>
