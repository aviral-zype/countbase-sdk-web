<html>

<head>
	<!-- Page styling here -->
	<link rel='stylesheet' type='text/css' href='./style/style.css'>
	<p><a href='https://countly.com/'>Countbase</a></p>

	<!--Countbase script-->
	<script type='text/javascript' src='../lib/countbase.js'></script>
	<script type='text/javascript'>
		Countbase = Countbase || {};
		Countbase.q = Countbase.q || [];

		//initializing first instance, which will be global Countbase
		const COUNTBASE_SERVER_KEY = "https://your.server.ly";
		const COUNTBASE_APP_KEY = "YOUR_APP_KEY";

		if (COUNTBASE_APP_KEY === "YOUR_APP_KEY" || COUNTBASE_SERVER_KEY === "https://your.server.ly") {
			console.warn("Please do not use default set of app key and server url")
		}
		// initializing countbase with params
		Countbase.init({
			app_key: COUNTBASE_APP_KEY,
			url: COUNTBASE_SERVER_KEY, //your server goes here
			debug: true
		})
		//report event to first app
		Countbase.add_event({
			key: "first_app"
		});



		//initialize second instance for another app synchronously
		const COUNTBASE_SERVER_KEY2 = "https://your.server.ly";
		const COUNTBASE_APP_KEY2 = "YOUR_APP_KEY2";

		if (COUNTBASE_APP_KEY2 === "YOUR_APP_KEY2" || COUNTBASE_SERVER_KEY2 === "https://your.server.ly") {
			console.warn("Please do not use default set of app key and server url")
		}
		// initializing countbase with params
		var Countbase2 = Countbase.init({
			app_key: COUNTBASE_APP_KEY2,
			url: COUNTBASE_SERVER_KEY2, //your server goes here
			debug: true
		});

		//report event to second app
		Countbase2.add_event({
			key: "second_app"
		});

		const COUNTBASE_SERVER_KEY3 = "https://your.server.ly";
		const COUNTBASE_APP_KEY3 = "YOUR_APP_KEY3";

		if (COUNTBASE_APP_KEY3 === "YOUR_APP_KEY3" || COUNTBASE_SERVER_KEY2 === "https://your.server.ly") {
			console.warn("Please do not use default set of app key and server url")
		}

		//initialize third instance for another app asynchronously
		Countbase.q.push(["init", {
			app_key: COUNTBASE_APP_KEY3, //must have different APP key
			url: COUNTBASE_SERVER_KEY3, //your server goes here
			debug: true
		}])
		//report event to third app asynchronously by passing app key as first arg
		Countbase.q.push([COUNTBASE_APP_KEY3, "add_event", {
			key: "third_app"
		}]);
	</script>
</head>

<body>
	<!-- Header, banner etc. Top part of your site  -->
	<div id="header">
		<h1>Multi Instancing</h1>
		<img id="logo" src="./images/logo.png">
	</div>

	<center>
		<img src="./images/team_countbase.jpg" id="wallpaper" />
	</center>
</body>

</html>
