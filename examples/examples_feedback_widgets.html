<html>

<head>
  <!-- Page styling here -->
  <link rel='stylesheet' type='text/css' href='./style/style.css'>

  <!--Countbase script-->
  <script type='text/javascript' src='../lib/countbase.js'></script>
  <script type='text/javascript'>

    const COUNTBASE_SERVER_KEY = "https://your.server.ly";
    const COUNTBASE_APP_KEY = "YOUR_APP_KEY";

    if (COUNTBASE_APP_KEY === "YOUR_APP_KEY" || COUNTBASE_SERVER_KEY === "https://your.server.ly") {
      console.warn("Please do not use default set of app key and server url")
    }
    // initializing countbase with params
    Countbase.init({
      app_key: COUNTBASE_APP_KEY,
      url: COUNTBASE_SERVER_KEY, //your server goes here
      debug: true
    });

    //=================================================
    // Displaying feedback widgets
    //=================================================
    Countbase.feedback.showNPS();

    // OR with a specific ID, name or tag
    // const id = 'ID_from_server';
    // Countbase.feedback.showNPS(id);

    // Other feedback widgets
    // Countbase.feedback.showSurvey();
    // Countbase.feedback.showRating();


    //=================================================
    // ADVANCED: Fetching and displaying feedback widgets
    //=================================================
    function fetchAndDisplayWidget() {
      Countbase.get_available_feedback_widgets(feedbackWidgetsCallback);
    }

    // Callback function to execute after fetching the feedback widgets
    function feedbackWidgetsCallback(countbasePresentableFeedback, err) {
      if (err) { // error handling
        console.log(err);
        return;
      }

      // Decide which which widget to show. Here the first rating widget is selected. 
      const widgetType = "survey";
      const countbaseFeedbackWidget = countbasePresentableFeedback.find(widget => widget.type === widgetType);
      if (!countbaseFeedbackWidget) {
        console.error(`[Countbase] No ${widgetType} widget found`);
        return;
      }

      // Define the element ID and the class name (optional)
      const selectorId = "";
      const selectorClass = "";

      // Define the segmentation (optional)
      const segmentation = { page: "home_page" };

      // Display the feedback widget to the end user 
      Countbase.present_feedback_widget(countbaseFeedbackWidget, selectorId, selectorClass, segmentation);
    }

    //=================================================
    // Fetching and reporting feedback widgets manually
    //=================================================
    // an example of getting the widget list, using it to get widget data and then recording data for it manually. widgetType can be 'nps', 'survey' or 'rating'    
    function getFeedbackWidgetListAndDoThings(widgetType) {
      // get the widget list
      Countbase.get_available_feedback_widgets(
        // callback function, 1st param is the feedback widget list
        function (feedbackList, err) {
          if (err) { // error handling
            console.log(err);
            return;
          }

          // find the widget object with the given widget type. This or a similar implementation can be used while using fetchAndDisplayWidget() as well
          const countbaseFeedbackWidget = feedbackList.find(widget => widget.type === widgetType);
          if (!countbaseFeedbackWidget) {
            console.error(`[Countbase] No ${widgetType} widget found`);
            return;
          }
          console.log(`[Countbase] Found ${widgetType} widget`);

          // Get data with the widget object
          Countbase.getFeedbackWidgetData(countbaseFeedbackWidget,
            // callback function, 1st param is the feedback widget data
            function (feedbackData, err) {
              if (err) { // error handling
                console.error(err);
                return;
              }

              const CountbaseWidgetData = feedbackData;
              console.log(`[Countbase] Found ${widgetType} widget data`, CountbaseWidgetData);
              // record data according to the widget type
              if (CountbaseWidgetData.type === 'nps') {
                console.log(`[Countbase] Recording NPS data manually`);
                Countbase.reportFeedbackWidgetManually(countbaseFeedbackWidget, CountbaseWidgetData, { rating: 5, comment: "comment" });
              } else if (CountbaseWidgetData.type === 'survey') {
                console.log(`[Countbase] Recording Survey data manually`);
                var widgetResponse = {};
                // form the key/value pairs according to data
                widgetResponse["answ-" + CountbaseWidgetData.questions[0].id] = CountbaseWidgetData.questions[0].type === "rating" ? 5 : "answer";
                Countbase.reportFeedbackWidgetManually(countbaseFeedbackWidget, CountbaseWidgetData, widgetResponse);
              } else if (CountbaseWidgetData.type === 'rating') {
                console.log(`[Countbase] Recording Rating data manually`);
                Countbase.reportFeedbackWidgetManually(countbaseFeedbackWidget, CountbaseWidgetData, { rating: 5, comment: "comment", email: "email", contactMe: true });
              }
            }

          );
        })
    }

    document.querySelector("#one").addEventListener("click", function () {
      fetchAndDisplayWidget();
    });
    document.querySelector("#two").addEventListener("click", function () {
      getFeedbackWidgetListAndDoThings('nps');
    });
    document.querySelector("#three").addEventListener("click", function () {
      getFeedbackWidgetListAndDoThings('survey');
    });
    document.querySelector("#four").addEventListener("click", function () {
      getFeedbackWidgetListAndDoThings('rating');
    });

  </script>
</head>

<body>
  <!-- Header, banner etc. Top part of your site  -->
  <div id="header">
    <h1>Feedback Widgets</h1>
    <img id="logo" src="./images/logo.png">
  </div>

  <center>
    <img src="./images/team_countbase.jpg" id="wallpaper" />
    <p><a href='https://countly.com/'>Countbase</a></p>
    <p><button id="one">Enable Feedback Widget</button></p>
    <p><button id="two">Manually Record NPS Data</button></p>
    <p><button id="three">Manually Record Survey Data</button></p>
    <p><button id="four">Manually Record Rating Data</button></p>
  </center>
</body>

</html>
